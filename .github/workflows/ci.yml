name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XMIGRATOR_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      - run: go test -race -count=1 tools/release.go tools/release_test.go
      - run: go test -race -count=1 tools/dev.go tools/dev_test.go
      - run: go run tools/dev.go check
      - run: go run tools/dev.go verify-install
      - run: go run tools/dev.go prove-regressions
      - run: go test . -run '^$' -fuzz FuzzSource -fuzztime 5s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-pg-${{ matrix.postgres }}
          path: .artifacts/
          include-hidden-files: true

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      - run: go test -race -count=1 tools/dev.go tools/dev_test.go
      - run: go run tools/dev.go check --sqlite-only

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      - run: go run tools/release.go
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --parallelism 2
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: .artifacts/release/
          include-hidden-files: true

name: checks
on:
  push:
  pull_request:

jobs:
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XMIGRATOR_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      - run: go run tools/dev.go check
      - run: go run tools/dev.go verify-install
      - run: go run tools/dev.go prove-regressions
      - run: go test . -run '^$' -fuzz FuzzSource -fuzztime 5s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-pg-${{ matrix.postgres }}
          path: .artifacts/

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: '**/go.sum'
      - run: go run tools/dev.go check --sqlite-only
